name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar pacotes (Expo + React Native)
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix || true
          node scripts/build-webgame.mjs
      - name: Conferir o TypeScript
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Gerar o projeto Android
        run: |
          npx expo prebuild -p android --no-install --clean
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          cp app/build/outputs/apk/release/app-release.apk ../../ColmeiaDeGuerra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ColmeiaDeGuerra.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Colmeia de Guerra v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          files: ColmeiaDeGuerra.apk
  teste:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Ligar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Testar no Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: bash .github/emu-test.sh
      - name: Guardar fotos do teste
        if: always()
        run: |
          cd shots || exit 0
          grep -E "ReactNativeJS|AndroidRuntime|FATAL|chromium|Console" logcat.txt | tail -300 > log-js.txt || true
          rm -f logcat.txt
          git init -q; git checkout -q -b ci-shots; git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "fotos do teste ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
